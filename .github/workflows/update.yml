name: Update phishing blocklist

on:
  schedule:
    # Run every 2 hours, offset from the top of the hour.
    - cron: "17 */2 * * *"

  # Allows manual execution from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: phishing-blocklist-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------------
      # RESTORE PREVIOUS SOURCE STATE
      # ------------------------------------------------------------

      - name: Restore previous feed state
        shell: bash
        run: |
          set -e

          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            echo "Previous state branch found."
            echo "Restoring previous feed and allowlist snapshots..."

            git fetch origin state:refs/remotes/origin/state

            git archive origin/state | tar -x

            echo "Previous state restored."
          else
            echo "No state branch exists yet."
            echo "This is the initial build."
          fi


      # ------------------------------------------------------------
      # BUILD BLOCKLIST
      # ------------------------------------------------------------

      - name: Build blocklist
        run: |
          python scripts/build.py


      # ------------------------------------------------------------
      # DISPLAY BUILD RESULTS
      # ------------------------------------------------------------

      - name: Show statistics
        run: |
          echo "=== statistics.json ==="
          cat data/statistics.json

          echo
          echo "=== Final list ==="
          wc -l lists/phishing.txt

          echo
          echo "=== First 20 entries ==="
          head -20 lists/phishing.txt


      # ------------------------------------------------------------
      # PREPARE GITHUB PAGES
      # ------------------------------------------------------------

      - name: Prepare GitHub Pages
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          # Copy the actual AdGuard blocklist.
          cp lists/phishing.txt public/phishing.txt

          # Copy machine-readable statistics.
          cp data/statistics.json public/statistics.json

          # Generate a simple human-readable status page.
          python - <<'PY'
          import html
          import json
          from pathlib import Path

          stats = json.loads(
              Path("data/statistics.json").read_text(
                  encoding="utf-8"
              )
          )

          rows = []

          for source in stats["sources"].values():
              name = html.escape(source["name"])
              count = f'{source["domain_count"]:,}'
              status = html.escape(source["status"])
              last_success = html.escape(
                  source["last_success_ist"] or "Never"
              )

              rows.append(
                  f"""
                  <tr>
                    <td>{name}</td>
                    <td>{count}</td>
                    <td>{status}</td>
                    <td>{last_success}</td>
                  </tr>
                  """
              )

          allowlist_rows = []

          for source in stats["allowlist_sources"].values():
              name = html.escape(source["name"])
              count = f'{source["domain_count"]:,}'
              matches = f'{source["matched_blocked_domains"]:,}'
              status = html.escape(source["status"])
              last_success = html.escape(
                  source["last_success_ist"] or "Never"
              )

              allowlist_rows.append(
                  f"""
                  <tr>
                    <td>{name}</td>
                    <td>{count}</td>
                    <td>{matches}</td>
                    <td>{status}</td>
                    <td>{last_success}</td>
                  </tr>
                  """
              )

          generated_at = html.escape(
              stats["generated_at_ist"]
          )

          final_count = f'{stats["final_unique_domains"]:,}'

          raw_count = f'{stats["raw_unique_domains"]:,}'

          allowlisted = f'{stats["allowlist_entries"]:,}'

          local_allowlist = (
              f'{stats["local_allowlist_entries"]:,}'
          )

          external_allowlist = (
              f'{stats["external_allowlist_entries"]:,}'
          )

          local_matches = (
              f'{stats["local_allowlist_matches"]:,}'
          )

          external_matches = (
              f'{stats["external_allowlist_matches"]:,}'
          )

          html_content = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1"
            >

            <title>Phishing Blocklist</title>

            <style>
              body {{
                font-family:
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                max-width: 1000px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.5;
              }}

              h1 {{
                margin-bottom: 5px;
              }}

              .subtitle {{
                color: #666;
                margin-top: 0;
              }}

              .stats {{
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(180px, 1fr));

                gap: 15px;
                margin: 30px 0;
              }}

              .card {{
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 15px;
              }}

              .number {{
                font-size: 1.5em;
                font-weight: 700;
              }}

              table {{
                border-collapse: collapse;
                width: 100%;
                margin-top: 15px;
              }}

              th,
              td {{
                border: 1px solid #ccc;
                padding: 9px;
                text-align: left;
              }}

              th {{
                background: #f3f3f3;
              }}

              code {{
                background: #f3f3f3;
                padding: 2px 5px;
                border-radius: 3px;
              }}

              a {{
                text-decoration: none;
              }}
            </style>
          </head>

          <body>

            <h1>Phishing Blocklist</h1>

            <p class="subtitle">
              Multi-source phishing and malicious-domain blocklist
              for AdGuard Home.
            </p>

            <div class="stats">

              <div class="card">
                <div>Final unique domains</div>
                <div class="number">{final_count}</div>
              </div>

              <div class="card">
                <div>Raw unique domains</div>
                <div class="number">{raw_count}</div>
              </div>

              <div class="card">
                <div>Unique allowlist entries</div>
                <div class="number">{allowlisted}</div>
              </div>

              <div class="card">
                <div>Local allowlist</div>
                <div class="number">{local_allowlist}</div>
              </div>

              <div class="card">
                <div>External allowlist</div>
                <div class="number">{external_allowlist}</div>
              </div>

            </div>

            <p>
              Generated:
              <code>{generated_at}</code>
            </p>

            <p>
              <a href="phishing.txt">
                Download AdGuard blocklist
              </a>

              &nbsp; | &nbsp;

              <a href="statistics.json">
                View statistics JSON
              </a>
            </p>

            <h2>Sources</h2>

            <table>

              <thead>
                <tr>
                  <th>Source</th>
                  <th>Domains</th>
                  <th>Status</th>
                  <th>Last successful update (IST)</th>
                </tr>
              </thead>

              <tbody>
                {"".join(rows)}
              </tbody>

            </table>

            <h2>External Allowlists</h2>

            <p>
              External allowlists are applied using exact hostname
              matching only. Parent domains do not automatically
              allow their subdomains.
            </p>

            <table>

              <thead>
                <tr>
                  <th>Source</th>
                  <th>Entries</th>
                  <th>Blocked domains removed</th>
                  <th>Status</th>
                  <th>Last successful update (IST)</th>
                </tr>
              </thead>

              <tbody>
                {"".join(allowlist_rows)}
              </tbody>

            </table>

            <p>
              Local allowlist matches removed:
              <strong>{local_matches}</strong>
              &nbsp; | &nbsp;
              External allowlist matches removed:
              <strong>{external_matches}</strong>
            </p>

          </body>
          </html>
          """

          Path("public/index.html").write_text(
              html_content,
              encoding="utf-8"
          )
          PY


      # ------------------------------------------------------------
      # CONFIGURE GITHUB PAGES
      # ------------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # ------------------------------------------------------------
      # UPLOAD PAGES ARTIFACT
      # ------------------------------------------------------------

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public


      # ------------------------------------------------------------
      # DEPLOY GITHUB PAGES
      # ------------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      # ------------------------------------------------------------
      # PREPARE STATE BRANCH
      # ------------------------------------------------------------

      - name: Prepare state branch
        shell: bash
        run: |
          set -e

          rm -rf /tmp/phishing-state

          mkdir -p \
            /tmp/phishing-state/lists/sources \
            /tmp/phishing-state/data

          cp \
            lists/phishing.txt \
            /tmp/phishing-state/lists/phishing.txt

          cp \
            lists/sources/*.txt \
            /tmp/phishing-state/lists/sources/

          cp \
            data/source_state.json \
            /tmp/phishing-state/data/source_state.json

          cp \
            data/statistics.json \
            /tmp/phishing-state/data/statistics.json


      # ------------------------------------------------------------
      # PUBLISH STATE BRANCH
      # ------------------------------------------------------------

      - name: Publish state branch
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Create a clean orphan branch.
          git switch --orphan state

          # Remove files inherited from main.
          git rm -rf . || true

          git clean -fdx

          # Restore only generated state.
          cp -r /tmp/phishing-state/* .

          # Prevent GitHub Pages/Jekyll processing on this branch.
          touch .nojekyll

          git add -A

          git commit \
            -m "Update generated phishing blocklist"

          # Replace the previous state snapshot.
          git push --force origin state
