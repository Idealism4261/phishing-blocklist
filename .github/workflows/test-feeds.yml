name: Test phishing feeds

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test feeds and build list
        run: |
          python scripts/build.py

      - name: Show statistics
        run: |
          cat data/statistics.json

      - name: Show list summary
        run: |
          echo "Generated list:"
          wc -l lists/phishing.txt
          echo
          echo "First 20 entries:"
          head -20 lists/phishing.txt
